<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIモデル早見表</title>
<meta name="description" content="OpenAI・Anthropic・Gemini・Grok・Muse の現行モデル名と版番号を毎日自動更新で一覧表示">
<style>
:root {
  --bg: #f7f6f2; --card: #ffffff; --ink: #1c1b18; --sub: #6b6860; --line: #e4e1d8;
  --accent: #b4441f; --new: #1f7a4d; --chip: #efece4;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #161513; --card: #1f1e1b; --ink: #ecebe6; --sub: #9c988e; --line: #33312c;
    --accent: #f08a5d; --new: #5fd09a; --chip: #2a2925; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.6 -apple-system, "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; }
main { max-width: 1500px; margin: 0 auto; padding: 24px 16px 64px; }
h1 { font-size: 22px; margin: 0 0 2px; letter-spacing: .02em; }
.meta { color: var(--sub); font-size: 13px; margin: 0 0 16px; }
.bar { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; margin-bottom: 20px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--card); }
.seg button { border: 0; background: none; color: var(--sub); font: inherit; padding: 6px 16px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
label.chk { color: var(--sub); font-size: 14px; cursor: pointer; user-select: none; }
#list.company { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; align-items: start; }
#list.smart ul { columns: 300px; column-gap: 0; }
#list.smart li { break-inside: avoid; }
section { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
section header { padding: 10px 12px; border-bottom: 1px solid var(--line); }
section h2 { font-size: 17px; margin: 0; }
section header span { display: block; color: var(--sub); font-size: 12px; }
section header b { color: var(--ink); }
ul { list-style: none; margin: 0; padding: 0; }
li { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center;
  padding: 7px 12px; border-bottom: 1px solid var(--line); }
li:last-child { border-bottom: 0; }
li.old { opacity: .6; }
.name { all: unset; cursor: pointer; font-weight: 600; font-size: 15px; }
.name:hover, .name:focus-visible { color: var(--accent); }
.id { display: block; color: var(--sub); font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; }
.tag { font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 4px; margin-left: 6px; vertical-align: 2px; }
.tag.new { color: var(--new); border: 1px solid var(--new); }
.tag.co { color: var(--sub); background: var(--chip); font-weight: 500; }
.score { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.score small { color: var(--sub); }
.score.none { color: var(--sub); font-size: 13px; }
.date { color: var(--sub); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
footer { color: var(--sub); font-size: 12px; margin-top: 24px; }
footer a { color: inherit; }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--bg);
  padding: 8px 16px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
#toast.on { opacity: 1; }
</style>
</head>
<body>
<main>
  <h1>AIモデル早見表</h1>
  <p class="meta" id="meta">読み込み中…</p>
  <div class="bar">
    <div class="seg" role="group" aria-label="並び順">
      <button type="button" data-mode="company" aria-pressed="true">会社順</button>
      <button type="button" data-mode="smart" aria-pressed="false">賢い順</button>
    </div>
    <label class="chk"><input type="checkbox" id="old"> 旧モデルも表示</label>
  </div>
  <div id="list"></div>
  <footer>
    モデル名を押すと API 用の ID をコピーします。点数は <a href="https://huggingface.co/datasets/lmarena-ai/leaderboard-dataset">Arena 公式データ</a>（テキスト総合、CC BY 4.0）、
    モデル一覧は <a href="https://openrouter.ai/models">OpenRouter</a> から毎日自動取得。点数のないモデルは「未評価」と表示します。
  </footer>
</main>
<div id="toast" role="status"></div>
<script>
const NEW_DAYS = 30;
let data = null, mode = "company", showOld = false;
const $ = (s) => document.querySelector(s);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const isNew = (m) => (Date.now() - Date.parse(m.released)) / 864e5 <= NEW_DAYS;
const byDate = (a, b) => b.released.localeCompare(a.released);
const byScore = (a, b) => (b.score ?? -1) - (a.score ?? -1) || byDate(a, b);

// 会社順の中の並び: 新着の未評価 → 点数の高い順 → 残りの未評価を新しい順
function companyOrder(models) {
  const fresh = models.filter((m) => m.score == null && isNew(m)).sort(byDate);
  const rest = models.filter((m) => !fresh.includes(m)).sort(byScore);
  return [...fresh, ...rest];
}

function row(m, company) {
  const li = el("li", m.current ? "" : "old");
  const left = el("div");
  const name = el("button", "name", m.name);
  name.type = "button";
  name.title = "ID をコピー";
  name.onclick = () => copy(m.id);
  left.append(name);
  if (isNew(m)) left.append(el("span", "tag new", "NEW"));
  if (company) left.append(el("span", "tag co", company));
  left.append(el("span", "id", `${m.id} · ${m.released}`));
  const score = el("div", m.score == null ? "score none" : "score");
  if (m.score == null) score.textContent = "未評価";
  else { score.append(String(m.score), el("small", "", ` (${m.rank}位)`)); }
  li.append(left, score);
  return li;
}

function render() {
  const list = $("#list");
  list.replaceChildren();
  list.className = mode;
  const visible = (m) => showOld || m.current;
  if (mode === "company") {
    for (const p of data.providers) {
      const models = companyOrder(p.models.filter(visible));
      const sec = el("section"), head = el("header"), ul = el("ul");
      head.append(el("h2", "", p.label));
      const latest = [...p.models].sort(byDate)[0];
      if (latest) head.append(el("span", "", `最新 ${latest.released}`));
      models.forEach((m) => ul.append(row(m)));
      sec.append(head, ul);
      list.append(sec);
    }
  } else {
    const all = data.providers.flatMap((p) => p.models.filter(visible).map((m) => ({ m, label: p.label })));
    all.sort((a, b) => byScore(a.m, b.m));
    const sec = el("section"), ul = el("ul");
    all.forEach(({ m, label }) => ul.append(row(m, label)));
    sec.append(ul);
    list.append(sec);
  }
}

async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast(`コピーしました: ${text}`); }
  catch { toast(text); }
}
let timer;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(timer); timer = setTimeout(() => t.classList.remove("on"), 1800); }

document.querySelectorAll(".seg button").forEach((b) => b.onclick = () => {
  mode = b.dataset.mode;
  document.querySelectorAll(".seg button").forEach((x) => x.setAttribute("aria-pressed", x === b));
  if (data) render();
});
$("#old").onchange = (e) => { showOld = e.target.checked; if (data) render(); };

fetch(`data.json?t=${Date.now()}`, { cache: "no-store" })
  .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then((d) => {
    data = d;
    const upd = new Date(d.updated_at).toLocaleString("ja-JP", { dateStyle: "medium", timeStyle: "short" });
    $("#meta").textContent = `最終更新 ${upd}` + (d.arena_date ? `　／　Arena 集計日 ${d.arena_date}` : "");
    render();
  })
  .catch((e) => { $("#meta").textContent = `データを読み込めませんでした (${e.message})`; });
</script>
</body>
</html>
